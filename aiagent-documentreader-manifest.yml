# ==============================================================================
# LTA Manifest — AI Agent Document Reader
# ==============================================================================
#
# Architecture:
#   - App Service (Frontend) → App Service (FastAPI Server) → PostgreSQL + Blob Storage
#   - FastAPI Server exposes data from PostgreSQL to the Frontend for invoice review/approval
#   - FastAPI Server also handles Blob Storage uploads from the Frontend
#   - Function App Worker (Backend) runs AI extraction (Doc Intelligence + OpenAI) independently
#   - Frontend talks to: Key Vault, App Insights, FastAPI Server
#   - FastAPI Server talks to: Key Vault, App Insights, PostgreSQL, Blob Storage
#   - Backend talks to: Key Vault, App Insights, PostgreSQL, OpenAI,
#                        Language, Doc Intelligence, Azure Blob Storage
#
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# PROJECT
# ──────────────────────────────────────────────────────────────────────────────
project:
  name: aiagent-documentreader
  environments: [dev, qa, prod]

# ──────────────────────────────────────────────────────────────────────────────
# RESOURCES
# ──────────────────────────────────────────────────────────────────────────────
resources:

  # ── Monitoring ──────────────────────────────────────────────────────────────
  - name: log-analytics
    type: log-analytics

  - name: appinsights
    type: app-insights
    dependsOn: [log-analytics]

  # ── Storage & Security ─────────────────────────────────────────────────────
  - name: storage
    type: storage-account

  - name: keyvault
    type: key-vault
    accessPolicies: true
    objectIdResources:
      - frontend-appservice
      - fastapi-appservice
      - backend-function

  # ── Compute ─────────────────────────────────────────────────────────────────
  - name: frontend-appservice
    type: app-service
    appServicePlan: frontend
    sku: P1V3

  - name: fastapi-appservice
    type: app-service
    appServicePlan: backend
    sku: P1V3
    dependsOn: [appinsights, storage]

  - name: backend-function
    type: function-app
    runtime: python
    runtimeVersion: "3.11"
    functionsRuntimeVersion: "~4"
    appServicePlan: backend
    sku: P1V3
    dependsOn: [storage, appinsights]

  # ── AI / Cognitive ──────────────────────────────────────────────────────────
  - name: openai
    type: openai
    sku: S0

  - name: content-filter
    type: content-filter
    connectedTo: openai

  - name: ai-docintelligence
    type: cognitive-service
    kind: FormRecognizer
    sku: S0

  - name: ai-language
    type: cognitive-service
    kind: TextAnalytics
    sku: S

  # ── Database ────────────────────────────────────────────────────────────────
  - name: postgresql-server
    type: postgresql
    sku: Standard_D2s_v3
    storageSizeGB: 32
    version: "15"
    edition: GeneralPurpose

# ──────────────────────────────────────────────────────────────────────────────
# CONNECTIONS
# ──────────────────────────────────────────────────────────────────────────────
connections:

  # ── Frontend → FastAPI Server ──────────────────────────────────────────────
  - from: frontend-appservice
    to: fastapi-appservice
    auth: managed-identity

  # ── Frontend → Shared Infrastructure ───────────────────────────────────────
  - from: frontend-appservice
    to: keyvault
    auth: managed-identity

  - from: frontend-appservice
    to: appinsights
    auth: managed-identity
    role: Monitoring Metrics Publisher

  # ── FastAPI Server → Data ─────────────────────────────────────────────
  - from: fastapi-appservice
    to: postgresql-server
    auth: managed-identity

  - from: fastapi-appservice
    to: storage
    auth: managed-identity
    role: Storage Blob Data Contributor

  # ── FastAPI Server → Shared Infrastructure ────────────────────────────────
  - from: fastapi-appservice
    to: keyvault
    auth: managed-identity

  - from: fastapi-appservice
    to: appinsights
    auth: managed-identity
    role: Monitoring Metrics Publisher

  # ── Backend → AI Services ───────────────────────────────────────────────────
  - from: backend-function
    to: openai
    auth: managed-identity
    role: Cognitive Services OpenAI User

  - from: backend-function
    to: ai-docintelligence
    auth: managed-identity
    role: Cognitive Services User

  - from: backend-function
    to: ai-language
    auth: managed-identity
    role: Cognitive Services User

  # ── Backend → Data ──────────────────────────────────────────────────────────
  - from: backend-function
    to: postgresql-server
    auth: managed-identity

  - from: backend-function
    to: storage
    auth: managed-identity
    role: Storage Blob Data Contributor

  # ── Backend → Shared Infrastructure ─────────────────────────────────────────
  - from: backend-function
    to: keyvault
    auth: managed-identity

  - from: backend-function
    to: appinsights
    auth: managed-identity
    role: Monitoring Metrics Publisher
