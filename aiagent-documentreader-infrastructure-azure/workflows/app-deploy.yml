# Deploy da aplicacao: so o servico que mudou.
#
# Separado do provisionamento de proposito. O aiagent-documentreader-infra-
# provision.yml continua sendo workflow_dispatch manual, porque todo run dele
# apaga as application settings da function (o functions.json monta
# siteConfig.appSettings como um concat(...) fechado). Se o provisionamento
# disparasse sozinho num push, a function ficaria mal configurada sem ninguem
# olhando -- e mal configurada aqui quer dizer SILENCIOSAMENTE mockada, porque
# use_real_services tem default False em shared/config.py.
name: AI Agent Document Reader — Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'function/**'
      - 'shared/shared/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'O que publicar'
        required: true
        default: 'settings-only'
        type: choice
        options: [frontend, backend, function, all, settings-only]

env:
  PROJECTNAME: aiagent-documentreader
  ENVIRONMENT: pov

jobs:
  # ==========================================================================
  # O que mudou
  # ==========================================================================
  changes:
    name: Decidir o que publicar
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend:  ${{ steps.f.outputs.backend }}
      function: ${{ steps.f.outputs.function }}
      migrate:  ${{ steps.f.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: f
        name: Comparar os caminhos
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            s='${{ inputs.service }}'
            fe=false; be=false; fn=false
            [ "$s" = "frontend" ] || [ "$s" = "all" ] && fe=true
            [ "$s" = "backend"  ] || [ "$s" = "all" ] && be=true
            [ "$s" = "function" ] || [ "$s" = "all" ] && fn=true
            # Migracao nunca sai de dispatch generico: tem job proprio.
            echo "frontend=$fe" >> "$GITHUB_OUTPUT"
            echo "backend=$be"  >> "$GITHUB_OUTPUT"
            echo "function=$fn" >> "$GITHUB_OUTPUT"
            echo "migrate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.before }}'
          # Primeiro push numa branch nova vem com before zerado.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"

          has() { echo "$changed" | grep -qE "$1"; }

          fe=false; be=false; fn=false; mg=false
          has '^frontend/'      && fe=true
          has '^backend/'       && be=true
          has '^function/'      && fn=true
          # shared/shared/ e a fonte unica das DUAS aplicacoes: mexeu ali, os
          # dois servicos tem de subir juntos, senao backend e function passam a
          # rodar versoes diferentes do mesmo dominio.
          has '^shared/shared/' && { be=true; fn=true; }
          # Migracao so dispara com arquivo novo em versions/.
          has '^backend/alembic/versions/' && mg=true

          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "backend=$be"  >> "$GITHUB_OUTPUT"
          echo "function=$fn" >> "$GITHUB_OUTPUT"
          echo "migrate=$mg"  >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Migracao de banco -- NAO automatizada; avisa alto e para
  # ==========================================================================
  #
  # Sondado em 27/09 e descartado: POST /api/command do SCM executa no container
  # do KUDU, nao no da aplicacao. Resposta literal:
  #   /opt/Kudu/Scripts/starter.sh: line 2: exec: alembic: not found   (127)
  #   /opt/Kudu/Scripts/starter.sh: line 2: exec: python: not found    (127)
  # E o wwwroot de la nao tem a aplicacao: tem output.tar.zst e
  # oryx-manifest.toml, porque o Oryx empacota e o container da aplicacao extrai
  # em outro lugar em tempo de execucao -- entao nem o alembic.ini estaria no
  # caminho.
  #
  # Enquanto a automacao nao existe, este job existe para que uma migracao nova
  # NUNCA passe despercebida: ele falha de proposito e imprime o que rodar.
  # Falha visivel e o oposto do modo de falha que este repo combate.
  migrate:
    name: Migracao pendente (manual)
    needs: [changes, backend]
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar e parar
        shell: bash
        run: |
          {
            echo "## Migracao pendente"
            echo
            echo "Este push traz arquivo novo em \`backend/alembic/versions/\`."
            echo "O backend ja foi publicado; **o schema ainda nao foi migrado**."
            echo
            echo "Roda pelo **webssh do fastapi**, autenticando como **administrador**"
            echo "do Entra -- nao como a Managed Identity da aplicacao."
            echo
            echo "Por que nao da para simplificar (medido em 25/09):"
            echo
            echo "- A MI so tem SELECT/INSERT/UPDATE/DELETE (secao 2.4 do DEPLOY.md),"
            echo "  entao \`alembic upgrade head\` puro devolve"
            echo "  \`must be owner of table invoices\`. DDL exige ser dono, e dono"
            echo "  e o grupo admin do Entra."
            echo "- Da VM o Postgres nao responde: o IP dela nao esta na allow-list"
            echo "  do firewall. Do container responde. Entao a migracao roda no"
            echo "  container, com o token do admin."
            echo "- O webssh trunca a entrada em **4095 caracteres** e o token tem"
            echo "  ~4500, entao ele vai em duas metades."
            echo
            echo "**Na VM (PowerShell):**"
            echo
            echo '```'
            echo '$t = (az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv).Trim()'
            echo '$h = [math]::Ceiling($t.Length/2)'
            echo '$p1 = $t.Substring(0,$h); $p2 = $t.Substring($h)'
            echo 'Set-Clipboard -Value $p1      # depois de colar a 1a metade: Set-Clipboard -Value $p2'
            echo '```'
            echo
            echo "**No webssh, no diretorio que tem o alembic.ini:**"
            echo
            echo '```'
            echo 'export DATABASE_URL="postgresql+psycopg://<grupo-admin>@<servidor>.postgres.database.azure.com:5432/documentreader?sslmode=require"'
            echo 'read -rs P1      # cola a 1a metade'
            echo 'read -rs P2      # cola a 2a metade'
            echo 'PGPASSWORD=$(printf "%s%s" "$P1" "$P2" | tr -d "\\r\\n "); export PGPASSWORD; unset P1 P2'
            echo 'echo "${#PGPASSWORD} $(printf "%s" "$PGPASSWORD" | awk -F. "{print NF}")"   # 4515 e 3'
            echo 'alembic current       # tem de imprimir a revisao ANTERIOR, sem erro'
            echo 'alembic upgrade head'
            echo '```'
            echo
            echo "O \`read -rs\` evita deixar o token no historico. O \`tr -d\` tira o"
            echo "CR que o clipboard do Windows cola junto -- com ele o servidor"
            echo "responde \`The access token has invalid format\`."
            echo
            echo "**Conferencia, por information_schema:**"
            echo
            echo '```'
            echo "SELECT column_name FROM information_schema.columns"
            echo " WHERE table_name = 'invoices';"
            echo '```'
            echo
            echo "\`alembic current\` nao serve de conferencia: le o carimbo, e"
            echo "migracao pode estar carimbada sem estar aplicada."
            echo
            echo "Depois, reinicie o fastapi e a function: eles carregaram o modelo"
            echo "antigo na memoria."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::migracao pendente -- veja o resumo deste job; roda no webssh COMO ADMIN, nao como a Managed Identity"
          exit 1

  # ==========================================================================
  # Frontend
  # ==========================================================================
  frontend:
    name: Publicar frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Carregar as variaveis
        shell: pwsh
        run: |
          Get-Content ".github/variables/global.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV
          Get-Content ".github/variables/${{ env.ENVIRONMENT }}.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV

      - name: Derivar o resource group
        shell: pwsh
        run: |
          if (-not $env:RESOURCEGROUPNAME) {
            echo "RESOURCEGROUPNAME=${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}" >> $env:GITHUB_ENV
          }

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURESUBSCRIPTIONID }}

      # O server.cjs e o dist/ sobem juntos: e ele que serve o bundle com
      # fallback de SPA. Sem ele o App Service nao tem o que executar.
      #
      # A extensao .cjs e o conserto, nao estilo. O package.json vai no zip e
      # declara "type": "module" (o Vite precisa); como server.js, o Node 20
      # carregava o arquivo como ESM e morria no primeiro require:
      #   ReferenceError: require is not defined in ES module scope
      # O container nunca subia, e o deploy caia por timeout de 10 minutos com
      # "the site failed to start" -- sem dizer que era o modulo. Com .cjs o
      # Node le CommonJS independente do package.json.
      - name: Empacotar
        working-directory: frontend
        run: zip -r ../frontend.zip dist server.cjs package.json

      # B1: o appCommandLine nao tem caminho de IaC (o app-service.json nao
      # expoe a propriedade), entao e reaplicado aqui a cada deploy. Sem ele o
      # container sobe o entrypoint da imagem em vez da aplicacao.
      #
      # Roda ANTES do publish: o az webapp deploy espera o site subir, e sobe
      # com o startup que estiver configurado naquele momento. Depois, o
      # deploy que muda o nome do arquivo esperaria 10 minutos por um
      # "node server.js" que o zip novo ja nao traz.
      - name: Startup command (B1)
        run: |
          az webapp config set -g "${{ env.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-frontend-appservice" \
            --startup-file "node server.cjs"

      - name: Publicar
        run: |
          az webapp deploy -g "${{ env.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-frontend-appservice" \
            --src-path frontend.zip --type zip

  # ==========================================================================
  # Backend
  # ==========================================================================
  backend:
    name: Publicar backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Sem isto o zip sobe sem backend/shared/ (gitignored) e o import quebra
      # no boot.
      - name: Vendorizar o shared
        run: bash scripts/build.sh

      - name: Carregar as variaveis
        shell: pwsh
        run: |
          Get-Content ".github/variables/global.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV
          Get-Content ".github/variables/${{ env.ENVIRONMENT }}.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV

      - name: Derivar o resource group
        shell: pwsh
        run: |
          if (-not $env:RESOURCEGROUPNAME) {
            echo "RESOURCEGROUPNAME=${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}" >> $env:GITHUB_ENV
          }

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURESUBSCRIPTIONID }}

      - name: Empacotar
        working-directory: backend
        run: zip -r ../backend.zip . -x '.venv/*' '*__pycache__/*'

      - name: Publicar
        run: |
          az webapp deploy -g "${{ env.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice" \
            --src-path backend.zip --type zip

      - name: Startup command (B1)
        run: |
          az webapp config set -g "${{ env.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice" \
            --startup-file "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

      # O App Service so aceita as redes da Caterpillar: a acao padrao e Deny e
      # as 11 regras Allow sao Cat_Amsterdam, Cat_Chicago, Cat_Dublin,
      # Cat_Peoria_Firewall, Cat_Plano, Cat_Singapore e os ExpressRoute NAT
      # (mais 32 dos IPs de saida do proprio frontend). Runner hospedado pelo
      # GitHub nao esta em nenhuma -- e por desenho, nao por engano.
      #
      # Por isso o /health daqui devolve 403 com a pagina "blocked your access",
      # e nao ha espera que resolva. O smoke test anterior gastava 10 minutos
      # batendo nisso e derrubava o job de um deploy saudavel. Pior, a conclusao
      # registrada na epoca -- "5 minutos nao bastam para o cold start" -- era
      # falsa: o curl manual que respondeu 200 logo em seguida saiu da rede da
      # CAT, nao do runner.
      #
      # Entao: orcamento curto, e o 403 da plataforma e reconhecido em vez de
      # confundido com aplicacao fora do ar. Erro de verdade (5xx, conexao
      # recusada, timeout) continua derrubando o job.
      - name: Smoke test
        run: |
          host="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice"
          # Montado em pedacos: o filtro de e-mail reescreve enderecos literais,
          # e este arquivo ja viajou por e-mail uma vez.
          dom=$(printf '%s.%s' azurewebsites net)
          url="https://${host}.${dom}/health"
          code=000
          for i in $(seq 1 8); do
            code=$(curl -s -m 20 -o /tmp/health.out -w '%{http_code}' "$url" || echo 000)
            echo "  tentativa $i/8: $code"
            [ "$code" = "200" ] && { echo "health OK"; exit 0; }
            # 403 e a restricao de rede respondendo, nao a aplicacao. Insistir
            # nao muda nada -- ela responde igual na primeira e na quadragesima.
            if [ "$code" = "403" ] && grep -q "blocked your access" /tmp/health.out 2>/dev/null; then
              break
            fi
            sleep 15
          done

          if [ "$code" = "403" ] && grep -q "blocked your access" /tmp/health.out 2>/dev/null; then
            {
              echo "### Smoke test nao pode rodar daqui"
              echo
              echo "O App Service devolveu **403 da restricao de rede**, nao da aplicacao."
              echo "A acao padrao e \`Deny\` e so as redes da Caterpillar estao liberadas;"
              echo "o runner do GitHub nao esta em nenhuma delas, por desenho."
              echo
              echo "**Isto nao diz nada sobre a saude do deploy.** Para verificar, de"
              echo "dentro da rede da CAT (a VM serve):"
              echo
              echo '```'
              echo "curl.exe -s -o NUL -w \"%{http_code}\" https://${host}.${dom}/health"
              echo '```'
              echo
              echo "Esperado: 200."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::/health nao e verificavel do runner (403 da allow-list); confira da rede da CAT"
            exit 0
          fi

          echo "::error::/health nao respondeu 200 (ultimo codigo: $code)"
          echo "--- ultimo corpo recebido ---"
          head -c 2000 /tmp/health.out || true
          exit 1

      # O que AINDA da para afirmar do runner, sem depender de rede: o site esta
      # habilitado e rodando. Nao prova que a aplicacao subiu -- prova que o
      # App Service nao ficou parado ou desabilitado pelo deploy.
      - name: Estado do site
        run: |
          estado=$(az webapp show -g "${{ env.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice" \
            --query state -o tsv)
          echo "estado do site: $estado"
          [ "$estado" = "Running" ] || { echo "::error::site nao esta Running"; exit 1; }

  # ==========================================================================
  # Function
  # ==========================================================================
  function:
    name: Publicar function
    needs: changes
    if: needs.changes.outputs.function == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendorizar o shared
        run: bash scripts/build.sh

      # As dependencias vao DENTRO do pacote, instaladas aqui. O build remoto
      # (scm-do-build-during-deployment) so roda se a app setting
      # SCM_DO_BUILD_DURING_DEPLOYMENT existir, e todo run de infraestrutura a
      # apaga (concat fechado do functions.json). Em 27/09 o deploy da leva 6
      # foi um rsync de 28 arquivos sem pip install: o wwwroot ficou sem
      # .python_packages, o worker nao importava o function_app, e o host
      # respondeu 404 a toda rota com state=Running e errors=null.
      #
      # A plataforma e a do HOST, nao a do runner. Sem --platform o pip escolhe
      # o wheel mais novo que o ubuntu-latest aceita: em 30/09 o cryptography
      # veio manylinux_2_34, o _rust.abi3.so pediu GLIBC_2.33 que o container
      # da function nao tem, o import quebrou no azure.identity (via
      # shared/db.py) e o host subiu com "No job functions found" -- 404 de
      # novo, agora com o pacote cheio. O import de conferencia abaixo passou,
      # porque roda na glibc do runner.
      - name: Instalar dependencias no pacote
        run: |
          pip install --target function/.python_packages/lib/site-packages \
            --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
            --python-version 3.11 --implementation cp --only-binary=:all: \
            -r function/requirements.txt

      # Ultima barreira antes de publicar. Ja subimos um modulo que compilava e
      # nao importava, e a function respondeu 404 ate alguem rodar isto. O
      # import usa SO o que vai no pacote: -S tira o site-packages do runner,
      # que mascararia uma dependencia ausente.
      - name: import function_app
        run: |
          cd function
          PYTHONPATH=.python_packages/lib/site-packages python -S -c "import function_app"

      # O import acima nunca pega extensao nativa construida para glibc nova
      # demais: o runner tem a glibc mais recente de todas. Isto le a versao
      # exigida por cada .so do pacote. O teto e o do manylinux_2_28 pedido
      # acima; o host ficou abaixo de 2.33 (medido pelo erro de 30/09), e 2.28
      # cobre qualquer Debian que ele possa ter. Controle negativo: o pacote
      # de 30/09 da GLIBC_2.34 no cryptography e cai aqui.
      - name: Conferir a glibc das extensoes nativas
        run: |
          set -euo pipefail
          teto=2.28
          falhou=0
          while IFS= read -r -d '' so; do
            v=$(objdump -T "$so" 2>/dev/null | grep -o 'GLIBC_[0-9][0-9.]*' \
                | sed 's/GLIBC_//' | sort -uV | tail -1 || true)
            [ -z "$v" ] && continue
            if [ "$(printf '%s\n%s\n' "$v" "$teto" | sort -V | tail -1)" != "$teto" ]; then
              echo "::error::GLIBC_$v > $teto em ${so#function/.python_packages/lib/site-packages/}"
              falhou=1
            fi
          done < <(find function/.python_packages -name '*.so*' -type f -print0)
          exit $falhou

      - name: Carregar as variaveis
        shell: pwsh
        run: |
          Get-Content ".github/variables/global.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV
          Get-Content ".github/variables/${{ env.ENVIRONMENT }}.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV

      - name: Derivar o resource group
        shell: pwsh
        run: |
          if (-not $env:RESOURCEGROUPNAME) {
            echo "RESOURCEGROUPNAME=${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}" >> $env:GITHUB_ENV
          }

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURESUBSCRIPTIONID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-backend-function
          package: function
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      # O host sobe Running e sem errors mesmo sem conseguir importar nada, e a
      # lista de funcoes do ARM e a do ultimo sync -- nenhum dos dois denuncia
      # o pacote sem dependencias. O wwwroot, pelo SCM, denuncia. O SCM nao
      # herda a restricao de rede do site, entao o runner alcanca.
      - name: Conferir o wwwroot
        shell: bash
        run: |
          set -euo pipefail
          FUNC="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-backend-function"
          SCM="https://${FUNC}.scm.azurewebsites.net"
          nomes=$(az rest --method get --resource "https://management.azure.com/" \
            --uri "$SCM/api/vfs/site/wwwroot/" --query "[].name" -o tsv)
          falhou=0
          for n in .python_packages function_app.py doc_worker.py shared pipeline; do
            if printf '%s\n' "$nomes" | grep -qx -- "$n"; then
              echo "  ok  $n"
            else
              echo "::error::$n AUSENTE do wwwroot"; falhou=1
            fi
          done
          exit $falhou

  # ==========================================================================
  # B2: reaplicar as application settings, e conferir que ficaram
  # ==========================================================================
  #
  # Este job e a alternativa fraca, e e fraca de um jeito especifico: o que ele
  # aplica morre no proximo run de provisionamento, inclusive um disparado por
  # policy remediation em vez de por nos. Por isso ele tambem e chamavel sozinho
  # (workflow_dispatch -> settings-only), para rodar depois de qualquer run de
  # infraestrutura sem republicar codigo.
  settings:
    name: Settings da function (B2)
    needs: [changes, function]
    if: >-
      always() && !cancelled() &&
      (needs.function.result == 'success' || inputs.service == 'settings-only')
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A CAT nao guarda o subscription id como secret: ele vem de
      # .github/variables/*.env, carregado para o GITHUB_ENV. E a mesma coisa
      # que os workflows de infraestrutura fazem -- ver docs/cat-cd/. Pedir um
      # secrets.AZURE_SUBSCRIPTION_ID inexistente rende o login vazio e o erro
      # "Ensure 'subscription-id' is supplied", que nao diz que o problema e a
      # convencao errada.
      - name: Carregar as variaveis
        shell: pwsh
        run: |
          Get-Content ".github/variables/global.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV
          Get-Content ".github/variables/${{ env.ENVIRONMENT }}.env" | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } >> $env:GITHUB_ENV

      - name: Derivar o resource group
        shell: pwsh
        run: |
          if (-not $env:RESOURCEGROUPNAME) {
            echo "RESOURCEGROUPNAME=${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}" >> $env:GITHUB_ENV
          }

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURESUBSCRIPTIONID }}

      - name: Aplicar
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}"
          RG="${{ env.RESOURCEGROUPNAME }}"
          FUNC="${PREFIX}-backend-function"

          # Mesmo calculo do main.bicep:
          #   toLower(take(replace(projectName,'-','') + environment + uniqueString(rg), 24))
          # Aqui o prefixo ja fecha 24 caracteres, entao o uniqueString e
          # truncado inteiro e o nome e deterministico. Isso e coincidencia de
          # comprimento, nao garantia -- o passo seguinte confere.
          ST=$(echo "${{ env.PROJECTNAME }}${{ env.ENVIRONMENT }}" | tr -d '-' | cut -c1-24 | tr 'A-Z' 'a-z')
          az storage account show -g "$RG" -n "$ST" -o none \
            || { echo "::error::storage derivado '$ST' nao existe: a derivacao do nome saiu do lugar"; exit 1; }

          PGHOST="${PREFIX}-postgresql-server.postgres.database.azure.com"

          az functionapp config appsettings set -g "$RG" -n "$FUNC" --output none --settings \
            "DATABASE_URL=postgresql+psycopg://${FUNC}@${PGHOST}:5432/documentreader?sslmode=require" \
            "DB_USE_ENTRA_TOKEN=true" \
            "AZURE_STORAGE_ACCOUNT_URL=https://${ST}.blob.core.windows.net" \
            "BLOB_CONTAINER_NAME=invoices" \
            "AZURE_DOCINTEL_ENDPOINT=https://${PREFIX}-ai-docintelligence.cognitiveservices.azure.com/" \
            "AZURE_OPENAI_ENDPOINT=https://${PREFIX}-openai.openai.azure.com/" \
            "USE_REAL_SERVICES=true" \
            "AZURE_OPENAI_DEPLOYMENT=gpt-4.1" \
            "AZURE_OPENAI_API_VERSION=2024-10-21" \
            "AZURE_DOCINTEL_HIGH_RES=false"

      # Conferir por tamanho, nunca a olho: o 'az ... -o table' reflui valores
      # longos, e isso ja nos fez diagnosticar um FUNCTION_URL truncado como
      # ausente. Valor nenhum e impresso.
      - name: Verificar
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ env.RESOURCEGROUPNAME }}"
          FUNC="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-backend-function"

          az functionapp config appsettings list -g "$RG" -n "$FUNC" \
            --query "[].{n:name,len:length(value)}" -o tsv > /tmp/settings.tsv

          falhou=0
          # nome:tamanho minimo esperado
          for par in \
            DATABASE_URL:100 DB_USE_ENTRA_TOKEN:4 AZURE_STORAGE_ACCOUNT_URL:40 \
            BLOB_CONTAINER_NAME:8 AZURE_DOCINTEL_ENDPOINT:60 AZURE_OPENAI_ENDPOINT:40 \
            USE_REAL_SERVICES:4 AZURE_OPENAI_DEPLOYMENT:7 AZURE_OPENAI_API_VERSION:10 \
            AZURE_DOCINTEL_HIGH_RES:4
          do
            nome="${par%%:*}"; minimo="${par##*:}"
            tam=$(awk -v n="$nome" '$1==n {print $2}' /tmp/settings.tsv)
            if [ -z "$tam" ]; then
              echo "::error::$nome AUSENTE"; falhou=1
            elif [ "$tam" -lt "$minimo" ]; then
              echo "::error::$nome truncado: $tam caracteres, esperado >= $minimo"; falhou=1
            else
              echo "  ok  $nome ($tam)"
            fi
          done

          # use_real_services tem default False em shared/config.py: se esta
          # setting sumir, a function volta a rodar MOCKADA em producao sem
          # emitir um unico erro. E o pior modo de falha da lista.
          [ "$(awk '$1=="USE_REAL_SERVICES" {print $2}' /tmp/settings.tsv)" = "4" ] \
            || { echo "::error::USE_REAL_SERVICES nao e 'true' -- a function esta mockada"; falhou=1; }

          exit $falhou
