# Deploy da aplicacao: so o servico que mudou.
#
# Separado do provisionamento de proposito. O aiagent-documentreader-infra-
# provision.yml continua sendo workflow_dispatch manual, porque todo run dele
# apaga as application settings da function (o functions.json monta
# siteConfig.appSettings como um concat(...) fechado). Se o provisionamento
# disparasse sozinho num push, a function ficaria mal configurada sem ninguem
# olhando -- e mal configurada aqui quer dizer SILENCIOSAMENTE mockada, porque
# use_real_services tem default False em shared/config.py.
name: AI Agent Document Reader — Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'function/**'
      - 'shared/shared/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'O que publicar'
        required: true
        default: 'settings-only'
        type: choice
        options: [frontend, backend, function, all, settings-only]

env:
  PROJECTNAME: aiagent-documentreader
  ENVIRONMENT: pov

jobs:
  # ==========================================================================
  # O que mudou
  # ==========================================================================
  changes:
    name: Decidir o que publicar
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend:  ${{ steps.f.outputs.backend }}
      function: ${{ steps.f.outputs.function }}
      migrate:  ${{ steps.f.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: f
        name: Comparar os caminhos
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            s='${{ inputs.service }}'
            fe=false; be=false; fn=false
            [ "$s" = "frontend" ] || [ "$s" = "all" ] && fe=true
            [ "$s" = "backend"  ] || [ "$s" = "all" ] && be=true
            [ "$s" = "function" ] || [ "$s" = "all" ] && fn=true
            # Migracao nunca sai de dispatch generico: tem job proprio.
            echo "frontend=$fe" >> "$GITHUB_OUTPUT"
            echo "backend=$be"  >> "$GITHUB_OUTPUT"
            echo "function=$fn" >> "$GITHUB_OUTPUT"
            echo "migrate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.before }}'
          # Primeiro push numa branch nova vem com before zerado.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"

          has() { echo "$changed" | grep -qE "$1"; }

          fe=false; be=false; fn=false; mg=false
          has '^frontend/'      && fe=true
          has '^backend/'       && be=true
          has '^function/'      && fn=true
          # shared/shared/ e a fonte unica das DUAS aplicacoes: mexeu ali, os
          # dois servicos tem de subir juntos, senao backend e function passam a
          # rodar versoes diferentes do mesmo dominio.
          has '^shared/shared/' && { be=true; fn=true; }
          # Migracao so dispara com arquivo novo em versions/.
          has '^backend/alembic/versions/' && mg=true

          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "backend=$be"  >> "$GITHUB_OUTPUT"
          echo "function=$fn" >> "$GITHUB_OUTPUT"
          echo "migrate=$mg"  >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Migracao de banco -- executada DENTRO do container do fastapi
  # ==========================================================================
  #
  # Nao adianta o runner falar com o Postgres: a allow-list do firewall tem os
  # IPs de saida do Function App, nao as faixas do GitHub, e o principal do CD
  # nao existe no banco. O App Service resolve os dois -- esta na rede e tem a
  # Managed Identity com direito no schema. E o mesmo caminho de quando se entra
  # pelo webssh e se roda alembic a mao; aqui so nao tem humano.
  #
  # Por isso roda DEPOIS do backend: o arquivo da migracao precisa estar no
  # wwwroot. A janela em que o codigo novo ve o schema velho e curta e so
  # importa em migracao destrutiva -- para essas, use o dispatch manual e
  # coordene a ordem.
  migrate:
    name: alembic upgrade head
    needs: [changes, backend]
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rodar alembic no container do fastapi
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice"
          # Montado em pedacos: o filtro de e-mail reescreve enderecos literais.
          SCM="${APP}.scm.$(printf '%s.%s' azurewebsites net)"
          TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)

          # Executa um comando no container e devolve o exit code de verdade.
          # Sem olhar o ExitCode, o curl retorna 200 mesmo com alembic falhando
          # e a migracao quebrada passaria por bem-sucedida.
          rodar() {
            local resp code
            resp=$(curl -sS --fail-with-body -X POST "https://${SCM}/api/command" \
                     -H "Authorization: Bearer ${TOKEN}" \
                     -H "Content-Type: application/json" \
                     -d "$(jq -nc --arg c "$1" '{command:$c, dir:"/home/site/wwwroot"}')")
            jq -r '.Output // ""' <<<"$resp"
            jq -r '.Error  // ""' <<<"$resp" >&2
            code=$(jq -r '.ExitCode // 1' <<<"$resp")
            return "$code"
          }

          echo "::group::SQL que vai ser aplicado"
          rodar "alembic upgrade head --sql" || echo "(nao foi possivel gerar o preview; segue mesmo assim)"
          echo "::endgroup::"

          rodar "alembic upgrade head"

      # 'alembic current' so le o carimbo, e uma migracao pode estar carimbada
      # sem estar aplicada. 'alembic check' compara os models contra o schema
      # real e falha se sobrou diferenca -- e a versao curta de conferir o
      # information_schema, que e a regra do repo.
      - name: Conferir que a migracao pegou (alembic check)
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice"
          SCM="${APP}.scm.$(printf '%s.%s' azurewebsites net)"
          TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)
          resp=$(curl -sS -X POST "https://${SCM}/api/command" \
                   -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
                   -d "$(jq -nc '{command:"alembic check", dir:"/home/site/wwwroot"}')")
          jq -r '.Output // ""' <<<"$resp"
          jq -r '.Error  // ""' <<<"$resp" >&2
          test "$(jq -r '.ExitCode // 1' <<<"$resp")" = "0" \
            || { echo "::error::schema nao bate com os models depois da migracao"; exit 1; }

  # ==========================================================================
  # Frontend
  # ==========================================================================
  frontend:
    name: Publicar frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # O server.js e o dist/ sobem juntos: e ele que serve o bundle com
      # fallback de SPA. Sem ele o App Service nao tem o que executar.
      - name: Empacotar
        working-directory: frontend
        run: zip -r ../frontend.zip dist server.js package.json

      - name: Publicar
        run: |
          az webapp deploy -g "${{ vars.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-frontend-appservice" \
            --src-path frontend.zip --type zip

      # B1: o appCommandLine nao tem caminho de IaC (o app-service.json nao
      # expoe a propriedade), entao e reaplicado aqui a cada deploy. Sem ele o
      # container sobe o entrypoint da imagem em vez da aplicacao.
      - name: Startup command (B1)
        run: |
          az webapp config set -g "${{ vars.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-frontend-appservice" \
            --startup-file "node server.js"

  # ==========================================================================
  # Backend
  # ==========================================================================
  backend:
    name: Publicar backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Sem isto o zip sobe sem backend/shared/ (gitignored) e o import quebra
      # no boot.
      - name: Vendorizar o shared
        run: bash scripts/build.sh

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Empacotar
        working-directory: backend
        run: zip -r ../backend.zip . -x '.venv/*' '*__pycache__/*'

      - name: Publicar
        run: |
          az webapp deploy -g "${{ vars.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice" \
            --src-path backend.zip --type zip

      - name: Startup command (B1)
        run: |
          az webapp config set -g "${{ vars.RESOURCEGROUPNAME }}" \
            -n "${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice" \
            --startup-file "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

      - name: Smoke test
        run: |
          host="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-fastapi-appservice"
          # Montado em pedacos: o filtro de e-mail reescreve enderecos literais,
          # e este arquivo ja viajou por e-mail uma vez.
          dom=$(printf '%s.%s' azurewebsites net)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${host}.${dom}/health" || true)
            [ "$code" = "200" ] && { echo "health OK"; exit 0; }
            sleep 10
          done
          echo "::error::/health nao respondeu 200 em 5 minutos"; exit 1

  # ==========================================================================
  # Function
  # ==========================================================================
  function:
    name: Publicar function
    needs: changes
    if: needs.changes.outputs.function == 'true'
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendorizar o shared
        run: bash scripts/build.sh

      # Ultima barreira antes de publicar. Ja subimos um modulo que compilava e
      # nao importava, e a function respondeu 404 ate alguem rodar isto.
      - name: import function_app
        run: |
          pip install -r function/requirements.txt
          cd function && python -c "import function_app"

      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-backend-function
          package: function
          scm-do-build-during-deployment: true
          enable-oryx-build: true

  # ==========================================================================
  # B2: reaplicar as application settings, e conferir que ficaram
  # ==========================================================================
  #
  # Este job e a alternativa fraca, e e fraca de um jeito especifico: o que ele
  # aplica morre no proximo run de provisionamento, inclusive um disparado por
  # policy remediation em vez de por nos. Por isso ele tambem e chamavel sozinho
  # (workflow_dispatch -> settings-only), para rodar depois de qualquer run de
  # infraestrutura sem republicar codigo.
  settings:
    name: Settings da function (B2)
    needs: [changes, function]
    if: >-
      always() && !cancelled() &&
      (needs.function.result == 'success' || inputs.service == 'settings-only')
    runs-on: ubuntu-latest
    environment: pov
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          environment: AzureCloud
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aplicar
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}"
          RG="${{ vars.RESOURCEGROUPNAME }}"
          FUNC="${PREFIX}-backend-function"

          # Mesmo calculo do main.bicep:
          #   toLower(take(replace(projectName,'-','') + environment + uniqueString(rg), 24))
          # Aqui o prefixo ja fecha 24 caracteres, entao o uniqueString e
          # truncado inteiro e o nome e deterministico. Isso e coincidencia de
          # comprimento, nao garantia -- o passo seguinte confere.
          ST=$(echo "${{ env.PROJECTNAME }}${{ env.ENVIRONMENT }}" | tr -d '-' | cut -c1-24 | tr 'A-Z' 'a-z')
          az storage account show -g "$RG" -n "$ST" -o none \
            || { echo "::error::storage derivado '$ST' nao existe: a derivacao do nome saiu do lugar"; exit 1; }

          PGHOST="${PREFIX}-postgresql-server.postgres.database.azure.com"

          az functionapp config appsettings set -g "$RG" -n "$FUNC" --output none --settings \
            "DATABASE_URL=postgresql+psycopg://${FUNC}@${PGHOST}:5432/documentreader?sslmode=require" \
            "DB_USE_ENTRA_TOKEN=true" \
            "AZURE_STORAGE_ACCOUNT_URL=https://${ST}.blob.core.windows.net" \
            "BLOB_CONTAINER_NAME=invoices" \
            "AZURE_DOCINTEL_ENDPOINT=https://${PREFIX}-ai-docintelligence.cognitiveservices.azure.com/" \
            "AZURE_OPENAI_ENDPOINT=https://${PREFIX}-openai.openai.azure.com/" \
            "USE_REAL_SERVICES=true" \
            "AZURE_OPENAI_DEPLOYMENT=gpt-4.1" \
            "AZURE_OPENAI_API_VERSION=2024-10-21" \
            "AZURE_DOCINTEL_HIGH_RES=false"

      # Conferir por tamanho, nunca a olho: o 'az ... -o table' reflui valores
      # longos, e isso ja nos fez diagnosticar um FUNCTION_URL truncado como
      # ausente. Valor nenhum e impresso.
      - name: Verificar
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCEGROUPNAME }}"
          FUNC="${{ env.PROJECTNAME }}-${{ env.ENVIRONMENT }}-backend-function"

          az functionapp config appsettings list -g "$RG" -n "$FUNC" \
            --query "[].{n:name,len:length(value)}" -o tsv > /tmp/settings.tsv

          falhou=0
          # nome:tamanho minimo esperado
          for par in \
            DATABASE_URL:100 DB_USE_ENTRA_TOKEN:4 AZURE_STORAGE_ACCOUNT_URL:40 \
            BLOB_CONTAINER_NAME:8 AZURE_DOCINTEL_ENDPOINT:60 AZURE_OPENAI_ENDPOINT:40 \
            USE_REAL_SERVICES:4 AZURE_OPENAI_DEPLOYMENT:7 AZURE_OPENAI_API_VERSION:10 \
            AZURE_DOCINTEL_HIGH_RES:4
          do
            nome="${par%%:*}"; minimo="${par##*:}"
            tam=$(awk -v n="$nome" '$1==n {print $2}' /tmp/settings.tsv)
            if [ -z "$tam" ]; then
              echo "::error::$nome AUSENTE"; falhou=1
            elif [ "$tam" -lt "$minimo" ]; then
              echo "::error::$nome truncado: $tam caracteres, esperado >= $minimo"; falhou=1
            else
              echo "  ok  $nome ($tam)"
            fi
          done

          # use_real_services tem default False em shared/config.py: se esta
          # setting sumir, a function volta a rodar MOCKADA em producao sem
          # emitir um unico erro. E o pior modo de falha da lista.
          [ "$(awk '$1=="USE_REAL_SERVICES" {print $2}' /tmp/settings.tsv)" = "4" ] \
            || { echo "::error::USE_REAL_SERVICES nao e 'true' -- a function esta mockada"; falhou=1; }

          exit $falhou
