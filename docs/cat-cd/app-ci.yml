# Portao de testes da aplicacao. NAO publica nada -- quem publica e o
# app-deploy.yml.
#
# Roda so o que e verificavel num runner limpo: o check_structurer.py depende do
# raw-civ-cap.json, que e artefato de cliente e nao e versionado, entao fica
# como passo manual na VM (ver docs/cat-cd/README.md).
name: AI Agent Document Reader — CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # PyPI pode estar bloqueado na rede da CAT. Aponte a variavel de repositorio
  # PIP_INDEX_URL para o Artifactory e todos os jobs passam a usar o feed
  # interno, sem alterar este arquivo.
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}

jobs:
  # ==========================================================================
  # Function: o import de verdade, nao py_compile
  # ==========================================================================
  function:
    name: Function (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 e o runtime do Function App; conferir noutra versao nao prova nada
      # sobre o que roda la.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendorizar o shared
        run: bash scripts/build.sh

      - name: Instalar dependencias
        run: pip install -r function/requirements.txt

      # O motivo de este passo existir: ja subimos um modulo que compilava mas
      # nao importava (cinco funcoes indentadas a mais viraram metodos de uma
      # classe; py_compile passa porque nome se resolve em tempo de chamada) e a
      # function respondeu 404 em producao ate alguem rodar isto.
      - name: import function_app
        working-directory: function
        run: python -c "import function_app"

      - name: check_rules
        run: python check_rules.py

  # ==========================================================================
  # Backend: import da app e migracoes contra um Postgres de verdade
  # ==========================================================================
  backend:
    name: Backend (Python 3.14)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: documentreader
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Vendorizar o shared
        run: bash scripts/build.sh

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: import app.main
        working-directory: backend
        run: python -c "from app.main import app; print(len(app.routes), 'rotas')"

      # Sobe da base ate a head num banco vazio: pega migracao que nao aplica e
      # head duplicada, que sao os dois jeitos de quebrar um ambiente novo.
      - name: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://invoice:invoice@localhost:5432/documentreader
        run: alembic upgrade head

      # Conferir por information_schema, nao por 'alembic current': uma migracao
      # pode estar carimbada sem estar aplicada.
      - name: Conferir que as colunas existem de fato
        env:
          PGPASSWORD: invoice
        run: |
          psql -h localhost -U invoice -d documentreader -tAc "
            SELECT count(*) FROM information_schema.columns
             WHERE table_name = 'invoice_part_number_items';" | {
            read n
            echo "colunas em invoice_part_number_items: $n"
            [ "$n" -gt 0 ] || { echo "::error::migracao carimbada mas nao aplicada"; exit 1; }
          }

  # ==========================================================================
  # Frontend: o build e o teste -- tsc -b quebra em erro de tipo
  # ==========================================================================
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
