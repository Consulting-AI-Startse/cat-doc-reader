[project]
name = "cat-doc-reader-backend"
version = "0.1.0"
description = "CAT Document Reader - backend (FastAPI)"
# 3.11 e o runtime das tres aplicacoes na Azure (linuxFxVersion). Declarar
# >=3.14 aqui impedia instalar o shared/ como pacote num venv 3.11 -- o deploy
# so nao quebrava porque vendoriza os arquivos em vez de instalar.
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "python-multipart",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "azure-storage-blob",
    "azure-identity",
    "shared",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }

# Indice de pacotes.
# Em dev fora da CAT: PyPI padrao.
# No ambiente da CAT: o indice e o Artifactory/JFrog (nao PyPI direto). Preencha a URL
# real do feed abaixo e descomente, OU exporte UV_INDEX_URL no shell / na VM.
# [[tool.uv.index]]
# name = "cat-artifactory"
# url = "https://<org>.jfrog.io/artifactory/api/pypi/<repo-pypi>/simple"
# default = true
