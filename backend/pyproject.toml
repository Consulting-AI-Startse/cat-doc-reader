[project]
name = "cat-doc-reader-backend"
version = "0.1.0"
description = "CAT Document Reader - backend (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "python-multipart",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "azure-storage-blob",
    "azure-identity",
    "shared",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }

# Indice de pacotes.
# Em dev fora da CAT: PyPI padrao.
# No ambiente da CAT: o indice e o Artifactory/JFrog (nao PyPI direto). Preencha a URL
# real do feed abaixo e descomente, OU exporte UV_INDEX_URL no shell / na VM.
# [[tool.uv.index]]
# name = "cat-artifactory"
# url = "https://<org>.jfrog.io/artifactory/api/pypi/<repo-pypi>/simple"
# default = true
